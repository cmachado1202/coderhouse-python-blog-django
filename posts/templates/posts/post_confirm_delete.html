{% extends 'posts/base.html' %}
{% block title %}Eliminar publicación · Blog de Carolina{% endblock %}
{% block content %}
<section class="presentacion"><h1>Eliminar publicación</h1></section>
<form class="tarjeta" method="post">
    {% csrf_token %}
    <p>¿Querés eliminar “{{ post.titulo }}”? Esta acción no se puede deshacer.</p>
    <button class="boton peligro" type="submit">Sí, eliminar</button>
    <a href="{% url 'posts:detalle_post' post.pk %}">Cancelar</a>
</form>
{% endblock %}
